# Mount the usage-stats server plugin when this package is registered as a
# DeepSeek Harness profile bundle.
#
# Dedicated Connection channels register their web route on the Connection
# owner fiber, so the `webServer` provider has to be selected by the
# `connection` row itself. Harness 0.2.1-alpha.2 replaced the bind/trust
# service `webRuntime` with `webStartup`; every supported generation provides
# `webStartup`, so the inject list below composes on both, and the
# trustedHosts expression reads whichever service the host provides.
#
# A profile patch replaces the matched row's `config`/`inject` as a whole.
# If a future Harness adds another field to the built-in connection row,
# copy it into this config before shipping; `scripts/test-package.mjs` and
# `scripts/test-host-current.mjs` pin the current shape.
- id: connection
  inject: [webStartup, webServer]
  config:
    trustedHosts: !!js ctx.get('webRuntime', false)?.trustedHosts ?? ctx.webStartup.trustedHosts

- insert:
    - id: usage-stats
      name: "@wannanbigpig/dsh-usage-stats"
